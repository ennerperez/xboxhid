[Mouse]
# Stick que mueve cursor. Overlay usa automáticamente el opuesto.
# Únicos valores admitidos: Left o Right. Overlay muestra LS o RS según corresponda.
PrimaryStick=Right

# Controles SDL configurables (nombres exactos):
# A, B, X, Y, LeftStick, RightStick, LeftShoulder, RightShoulder,
# DPadUp, DPadDown, DPadLeft, DPadRight, Misc1, RightPaddle1,
# LeftPaddle1, RightPaddle2, LeftPaddle2, Touchpad, Misc2..Misc6,
# LeftTrigger y RightTrigger. SDL valida cuáles reporta el mando activo al conectar.
# Back, Guide y Start están reservados y nunca pueden aparecer en mappings/acciones.
# Última prueba local (2026-10-14), Xbox Series X Controller: A, B, X, Y, Back,
# Guide, Start, LeftStick, RightStick, LeftShoulder, RightShoulder, DPad completo y Misc1;
# ejes LeftX/LeftY/RightX/RightY/LeftTrigger/RightTrigger. Consola imprime lista actual.
LeftButton=LeftTrigger
RightButton=RightTrigger
MiddleButton=RightStick

# Mantener modificador y activar LeftButton fija click izquierdo. Luego cualquier click
# o acción configurada hace drop; mover cursor no lo cancela.
DragDropModifier=RightShoulder

# Segundos base para '*' y umbral 0-1 usado al mapear gatillos.
DefaultThreshold=0.5
Speed=1200
DeadZone=0.16
InvertedXAxis=false
InvertedYAxis=false
BoostButton=RightShoulder
BoostMultiplier=2

# Mapping origen: / alternativas, - simultáneos, + orden/mantener, * espera temporal.
# Ejemplos: A/B; A-B-X; A+Y+B; DPadUp**B (espera DefaultThreshold x2).
# No mezclar +, - y * dentro de una misma alternativa.
[Actions]
# Destino: CTRL, ALT, SHIFT, META, TAB, DELETE, SPACE, ENTER, ESCAPE,
# LEFT/RIGHT/UP/DOWN, VOLUMEUP/VOLUMEDOWN, A-Z y 0-9; combinar usando +.
DPadUp=VOLUMEUP
DPadDown=VOLUMEDOWN
DPadLeft=ALT+TAB
DPadRight=ALT+SHIFT+TAB

[Diagnostics]
# Si está activo, escribe logs Serilog en ./logs/. Con false no crea archivos.
Debug=true

[Overlay]
# Back muestra u oculta teclado. Back + Start conserva cierre inmediato.
Enabled=true

# Valores: DaisyWheel, CharacterCycling o GlyphStick.
Mode=DaisyWheel

# Presentación: opacidad 0.2-1.0 y escala 0.5-2.0.
Opacity=0.94
Scale=1
